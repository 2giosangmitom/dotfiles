# nightfall.nvim - the deeper-night flavor
# Generated by `just extras`, do not edit.

[mgr]
cwd = { fg = "#b5ffe9" }
find_keyword = { fg = "#fcc737", bold = true }
find_position = { fg = "#e2adf2", bg = "reset", bold = true }
symlink_target = { fg = "#7071b5", italic = true }
marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#ff5e5b", bg = "#ff5e5b" }
marker_marked = { fg = "#72bda3", bg = "#72bda3" }
marker_selected = { fg = "#fcc737", bg = "#fcc737" }
count_copied = { fg = "#05080c", bg = "#a6e3a1" }
count_cut = { fg = "#05080c", bg = "#ff5e5b" }
count_selected = { fg = "#05080c", bg = "#fcc737" }
border_symbol = "│"
border_style = { fg = "#3a4360" }

[tabs]
active = { fg = "#05080c", bg = "#89b4fa", bold = true }
inactive = { fg = "#f8e9e9", bg = "#262e40" }

[mode]
normal_main = { fg = "#05080c", bg = "#89b4fa", bold = true }
normal_alt = { fg = "#89b4fa", bg = "#262e40" }
select_main = { fg = "#05080c", bg = "#a6e3a1", bold = true }
select_alt = { fg = "#a6e3a1", bg = "#262e40" }
unset_main = { fg = "#05080c", bg = "#ceabb1", bold = true }
unset_alt = { fg = "#ceabb1", bg = "#262e40" }

[indicator]
parent = { fg = "#f8e9e9", bg = "#262e40" }
current = { fg = "#f8e9e9", bg = "#262e40" }
preview = { underline = true }

[status]
overall = { fg = "#f8e9e9", bg = "#0e131b" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#4c5480" }
perm_type = { fg = "#94e2d5" }
perm_read = { fg = "#fcc737" }
perm_write = { fg = "#ff5e5b" }
perm_exec = { fg = "#a6e3a1" }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#262e40" }
progress_error = { fg = "#ff5e5b", bg = "#262e40" }

[which]
border = { fg = "#89b4fa" }
cols = 3
mask = { bg = "#262e40" }
cand = { fg = "#b5ffe9" }
rest = { fg = "#7071b5" }
desc = { fg = "#e2adf2" }
separator = "  "
separator_style = { fg = "#3a4360" }

[confirm]
border = { fg = "#89b4fa" }
title = { fg = "#89b4fa" }
body = { fg = "#f8e9e9" }
list = { fg = "#b5ffe9" }
btn_yes = { fg = "#05080c", bg = "#a6e3a1" }
btn_no = { fg = "#05080c", bg = "#ff5e5b" }

[spot]
border = { fg = "#89b4fa" }
title = { fg = "#89b4fa" }
tbl_col = { fg = "#b5ffe9" }
tbl_cell = { fg = "#05080c", bg = "#fcc737" }

[notify]
title_info = { fg = "#a6e3a1" }
title_warn = { fg = "#f9e2af" }
title_error = { fg = "#ff5e5b" }

[pick]
border = { fg = "#89b4fa" }
active = { fg = "#e2adf2", bold = true }
inactive = { fg = "#f8e9e9" }

[input]
border = { fg = "#89b4fa" }
title = { fg = "#f8e9e9" }
value = { fg = "#f8e9e9" }
selected = { bg = "#262e40" }

[cmp]
border = { fg = "#89b4fa" }
active = { fg = "#e2adf2", bold = true }
inactive = { fg = "#f8e9e9" }

[tasks]
border = { fg = "#89b4fa" }
title = { fg = "#f8e9e9" }
hovered = { fg = "#e2adf2", underline = true }

[help]
border = { fg = "#89b4fa" }
chord = { fg = "#b5ffe9" }
action = { fg = "#e2adf2" }
hovered = { bg = "#262e40", bold = true }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#b5ffe9" },
  { mime = "**/{audio,video}/*", fg = "#fcc737" },
  { mime = "**/application/{,g}zip", fg = "#e2adf2" },
  { mime = "**/application/{tar,bzip*,7z-compressed,xz,rar}", fg = "#e2adf2" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#a6e3a1" },
  { mime = "vfs/{absent,stale}", fg = "#7071b5" },
  { url = "*", is = "orphan", bg = "#ff5e5b" },
  { url = "*", is = "dummy", bg = "#ff5e5b" },
  { url = "*/", is = "dummy", bg = "#ff5e5b" },
  { url = "*", is = "exec", fg = "#a6e3a1" },
  { url = "*/", fg = "#89b4fa" },
]

