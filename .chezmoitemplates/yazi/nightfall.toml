[help]
border = { fg = "#9a86fd" }
chord = { fg = "#8be9fd" }
action = { fg = "#e2adf2" }
hovered = { bg = "#2d2d4e", bold = true }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#8be9fd" },
  { mime = "**/{audio,video}/*", fg = "#fcc737" },
  { mime = "**/application/{,g}zip", fg = "#e2adf2" },
  { mime = "**/application/{tar,bzip*,7z-compressed,xz,rar}", fg = "#e2adf2" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#50fa7b" },
  { mime = "vfs/{absent,stale}", fg = "#7b7bb5" },
  { url = "*", is = "orphan", bg = "#ff4860" },
  { url = "*", is = "dummy", bg = "#ff4860" },
  { url = "*/", is = "dummy", bg = "#ff4860" },
  { url = "*", is = "exec", fg = "#50fa7b" },
  { url = "*/", fg = "#9a86fd" },
]

