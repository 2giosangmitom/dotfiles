[mgr]
cwd = { fg = "#8be9fd" }
find_keyword = { fg = "#fcc737", bold = true }
find_position = { fg = "#e2adf2", bg = "reset", bold = true }
symlink_target = { fg = "#7b7bb5", italic = true }
marker_copied = { fg = "#50fa7b", bg = "#50fa7b" }
marker_cut = { fg = "#ff4860", bg = "#ff4860" }
marker_marked = { fg = "#20e3b2", bg = "#20e3b2" }
marker_selected = { fg = "#fcc737", bg = "#fcc737" }
count_copied = { fg = "#0a0a12", bg = "#50fa7b" }
count_cut = { fg = "#0a0a12", bg = "#ff4860" }
count_selected = { fg = "#0a0a12", bg = "#fcc737" }
border_symbol = "│"
border_style = { fg = "#3b3b66" }

[tabs]
