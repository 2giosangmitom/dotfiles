sep_right = { open = "", close = "" }
perm_sep = { fg = "#55558f" }
perm_type = { fg = "#2cccff" }
perm_read = { fg = "#fcc737" }
perm_write = { fg = "#ff4860" }
perm_exec = { fg = "#50fa7b" }
progress_label = { fg = "#f7f7fb", bold = true }
progress_normal = { fg = "#9a86fd", bg = "#2d2d4e" }
progress_error = { fg = "#ff4860", bg = "#2d2d4e" }

[which]
border = { fg = "#9a86fd" }
cols = 3
mask = { bg = "#2d2d4e" }
cand = { fg = "#8be9fd" }
rest = { fg = "#7b7bb5" }
desc = { fg = "#e2adf2" }
separator = "  "
separator_style = { fg = "#3b3b66" }

[confirm]
border = { fg = "#9a86fd" }
title = { fg = "#9a86fd" }
body = { fg = "#e9e9f4" }
list = { fg = "#8be9fd" }
btn_yes = { fg = "#0a0a12", bg = "#50fa7b" }
btn_no = { fg = "#0a0a12", bg = "#ff4860" }

[spot]
border = { fg = "#9a86fd" }
title = { fg = "#9a86fd" }
tbl_col = { fg = "#8be9fd" }
tbl_cell = { fg = "#0a0a12", bg = "#fcc737" }

[notify]
title_info = { fg = "#50fa7b" }
title_warn = { fg = "#f1fa8c" }
title_error = { fg = "#ff4860" }

[pick]
border = { fg = "#9a86fd" }
active = { fg = "#e2adf2", bold = true }
inactive = { fg = "#e9e9f4" }

[input]
border = { fg = "#9a86fd" }
title = { fg = "#e9e9f4" }
value = { fg = "#e9e9f4" }
selected = { bg = "#2d2d4e" }

[cmp]
border = { fg = "#9a86fd" }
active = { fg = "#e2adf2", bold = true }
inactive = { fg = "#e9e9f4" }

[tasks]
border = { fg = "#9a86fd" }
title = { fg = "#e9e9f4" }
