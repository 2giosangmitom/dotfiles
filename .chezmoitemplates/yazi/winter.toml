# nightfall.nvim - the winter flavor
# Generated by `just extras`, do not edit.

[mgr]
cwd = { fg = "#087F9B" }
find_keyword = { fg = "#8A5A00", bold = true }
find_position = { fg = "#7D3C98", bg = "reset", bold = true }
symlink_target = { fg = "#647386", italic = true }
marker_copied = { fg = "#287A45", bg = "#287A45" }
marker_cut = { fg = "#B4233C", bg = "#B4233C" }
marker_marked = { fg = "#187A70", bg = "#187A70" }
marker_selected = { fg = "#8A5A00", bg = "#8A5A00" }
count_copied = { fg = "#17202D", bg = "#287A45" }
count_cut = { fg = "#17202D", bg = "#B4233C" }
count_selected = { fg = "#17202D", bg = "#8A5A00" }
border_symbol = "│"
border_style = { fg = "#D3DCE8" }

[tabs]
active = { fg = "#17202D", bg = "#245EA8", bold = true }
inactive = { fg = "#273548", bg = "#C4D2E4" }

[mode]
normal_main = { fg = "#17202D", bg = "#245EA8", bold = true }
normal_alt = { fg = "#245EA8", bg = "#C4D2E4" }
select_main = { fg = "#17202D", bg = "#287A45", bold = true }
select_alt = { fg = "#287A45", bg = "#C4D2E4" }
unset_main = { fg = "#17202D", bg = "#9C466D", bold = true }
unset_alt = { fg = "#9C466D", bg = "#C4D2E4" }

[indicator]
parent = { fg = "#273548", bg = "#C4D2E4" }
current = { fg = "#273548", bg = "#C4D2E4" }
preview = { underline = true }

[status]
overall = { fg = "#273548", bg = "#F7F9FC" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#8A98A9" }
perm_type = { fg = "#245EA8" }
perm_read = { fg = "#8A5A00" }
perm_write = { fg = "#B4233C" }
perm_exec = { fg = "#287A45" }
progress_label = { fg = "#111B29", bold = true }
progress_normal = { fg = "#245EA8", bg = "#C4D2E4" }
progress_error = { fg = "#B4233C", bg = "#C4D2E4" }

[which]
border = { fg = "#245EA8" }
cols = 3
mask = { bg = "#C4D2E4" }
cand = { fg = "#087F9B" }
rest = { fg = "#647386" }
desc = { fg = "#7D3C98" }
separator = "  "
separator_style = { fg = "#D3DCE8" }

[confirm]
border = { fg = "#245EA8" }
title = { fg = "#245EA8" }
body = { fg = "#273548" }
list = { fg = "#087F9B" }
btn_yes = { fg = "#17202D", bg = "#287A45" }
btn_no = { fg = "#17202D", bg = "#B4233C" }

[spot]
border = { fg = "#245EA8" }
title = { fg = "#245EA8" }
tbl_col = { fg = "#087F9B" }
tbl_cell = { fg = "#17202D", bg = "#8A5A00" }

[notify]
title_info = { fg = "#287A45" }
title_warn = { fg = "#8A6500" }
title_error = { fg = "#B4233C" }

[pick]
border = { fg = "#245EA8" }
active = { fg = "#7D3C98", bold = true }
inactive = { fg = "#273548" }

[input]
border = { fg = "#245EA8" }
title = { fg = "#273548" }
value = { fg = "#273548" }
selected = { bg = "#C4D2E4" }

[cmp]
border = { fg = "#245EA8" }
active = { fg = "#7D3C98", bold = true }
inactive = { fg = "#273548" }

[tasks]
border = { fg = "#245EA8" }
title = { fg = "#273548" }
hovered = { fg = "#7D3C98", underline = true }

[help]
border = { fg = "#245EA8" }
chord = { fg = "#087F9B" }
action = { fg = "#7D3C98" }
hovered = { bg = "#C4D2E4", bold = true }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#087F9B" },
  { mime = "**/{audio,video}/*", fg = "#8A5A00" },
  { mime = "**/application/{,g}zip", fg = "#7D3C98" },
  { mime = "**/application/{tar,bzip*,7z-compressed,xz,rar}", fg = "#7D3C98" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#287A45" },
  { mime = "vfs/{absent,stale}", fg = "#647386" },
  { url = "*", is = "orphan", bg = "#B4233C" },
  { url = "*", is = "dummy", bg = "#B4233C" },
  { url = "*/", is = "dummy", bg = "#B4233C" },
  { url = "*", is = "exec", fg = "#287A45" },
  { url = "*/", fg = "#245EA8" },
]

