# Theme palettes: the single source of truth for every themed app.
#
# Colors come from nightfall.nvim (~/Workspace/nightfall.nvim). Each flavor has
# the same keys, so templates can use any of them without knowing the flavor:
#
#   bg / fg / fg_dim / fg_bright   main background and text
#   crust                          darkest shade; text on colored backgrounds
#   surface / selection / border   raised panels, selected rows, separators
#   muted                          de-emphasized text (symlinks, hints)
#   accent / hover / pink          focus color, hover state, secondary highlight
#   search / peach                 search match and line indicator backgrounds
#   normal / bright / dim          the 8 ANSI terminal colors at each intensity
#
# The active flavor is read from `state_file` (written by mitom-theme-switch)
# and falls back to `default`. Templates load it with:
#
#   {{- $flavor := includeTemplate "theme/flavor" . -}}
#   {{- $t := index .theme.flavors $flavor -}}

[theme]
default = "nightfall"
state_file = ".config/nightfall/theme"

# Targets re-applied by mitom-theme-switch. Add a path here when you theme a
# new app.
targets = [
  ".config/alacritty/theme.toml",
  ".config/lazygit/config.yml",
  ".config/niri/layout.kdl",
  ".config/noctalia/noctalia-config.toml",
  ".config/noctalia/palettes",
  ".config/yazi/theme.toml",
]

[theme.flavors.nightfall]
bg        = "#141423"
